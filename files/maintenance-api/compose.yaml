
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: maintenance

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d maintenance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./app
    restart: unless-stopped

    ports:
      - "10.77.10.20:3000:3000"

    environment:
      DB_HOST: db
      DB_USER: labuser
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_NAME: maintenance

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
